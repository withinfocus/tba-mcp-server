# pnpm settings. As of pnpm 11 this file, not package.json or .npmrc, is where
# pnpm-specific configuration lives. See https://pnpm.io/settings.

# Save dependency versions exactly; upgrades are handled by Dependabot.
savePrefix: ""

# Dependencies allowed to run install lifecycle scripts. Everything else is
# blocked by default; run `pnpm approve-builds` to review new requests.
allowBuilds:
  # Unpacks the bundled web, CLI, and TUI clients that `pnpm run inspect` runs.
  "@modelcontextprotocol/inspector": true
  # Pulled in by jest-haste-map. Ships prebuilt platform bindings, so the
  # build-from-source fallback never has to run.
  "@parcel/watcher": false
  # Selects the prebuilt native binding for the current platform.
  unrs-resolver: true

# ajv pulls in fast-uri, and 3.1.5 carries four high-severity advisories:
# host confusion via percent-encoded scheme normalization and skipped IDN
# canonicalization, plus SSRF via malformed IPv6 normalization and repeated
# hostname percent-decoding. All four are fixed in 3.1.6. Four more, from
# low to medium, are fixed in 3.1.9. Held to the 3.x line because ajv asks
# for ^3.0.1; an unbounded floor resolves 4.x and takes a transitive major
# that ajv has not declared support for. Drop this once ajv requires a
# patched version on its own.
#
# postcss pulls in nanoid, and 3.3.17 carries a high-severity advisory: the
# custom generators spin forever when handed a size of zero, hanging the
# calling thread. Fixed in 3.3.18. Only the inspector's dev tree reaches it,
# by way of `vite`. Held to the 3.x line because postcss asks for ^3.3.17.
#
# express and body-parser pull in qs, and 6.15.3 carries two medium-severity
# denial-of-service advisories: improper validation in the stringify
# function, and an array limit bypass in the query string parser. Both are
# fixed in 6.16.0, and a third (GHSA-6pq8-jhm2-2vcw) in 6.16.1. express
# reaches production through the MCP SDK. Held to the 6.x line because
# body-parser asks for ^6.15.2 and express for ^6.14.0.
#
# jest's coverage loader (@istanbuljs/load-nyc-config) pulls in js-yaml, and
# 3.15.1 carries a high-severity CPU denial of service through empty merge
# sources (GHSA-2883-xcg3-v3hh). Fixed in 3.15.2. Dev only. Held to the 3.x
# line because load-nyc-config asks for ^3.13.1.
#
# eslint, typescript-eslint, and jest's coverage tooling pull in minimatch 9
# and 10 and glob 10 and 13. Both carry a medium-severity advisory
# (GHSA-g3hv-75wg-m249 for minimatch, GHSA-3g3m-2fjr-6pw4 for glob) that is
# only fixed in a new major: minimatch 11.0.1 and glob 14.0.2. No fix was
# backported. The majors drop APIs these consumers do not call (makeRe, the
# AST class, the debug option) and keep the CommonJS builds jest requires, so
# the override is a transitive major on purpose. Moving minimatch 9 off the
# tree also retires brace-expansion 2.1.4 and its three advisories
# (GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr). Dev only.
# Drop these once eslint, typescript-eslint, and test-exclude move to the
# patched majors.
overrides:
  fast-uri: "^3.1.9"
  nanoid: "^3.3.18"
  qs: "^6.16.1"
  js-yaml@3: "^3.15.2"
  minimatch: "^11.0.1"
  glob: "^14.0.2"

# jest-config pulls in deepmerge, and every release through 4.3.1, the
# latest, carries a low-severity prototype poisoning advisory with no fixed
# release. jest only merges its own config objects with it, so untrusted
# input never reaches it. Mirrored in osv-scanner.toml. Remove once a fixed
# deepmerge ships.
auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4
