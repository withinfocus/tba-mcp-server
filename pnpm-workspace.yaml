# pnpm settings. As of pnpm 11 this file, not package.json or .npmrc, is where
# pnpm-specific configuration lives. See https://pnpm.io/settings.

# Save dependency versions exactly; upgrades are handled by Dependabot.
savePrefix: ""

# Dependencies allowed to run install lifecycle scripts. Everything else is
# blocked by default; run `pnpm approve-builds` to review new requests.
allowBuilds:
  # Unpacks the bundled web, CLI, and TUI clients that `pnpm run inspect` runs.
  "@modelcontextprotocol/inspector": true
  # Pulled in by jest-haste-map. Ships prebuilt platform bindings, so the
  # build-from-source fallback never has to run.
  "@parcel/watcher": false
  # Selects the prebuilt native binding for the current platform.
  unrs-resolver: true

# jest's coverage tooling (babel-plugin-istanbul > test-exclude), eslint, and
# typescript-eslint pull in minimatch 9 and 10 and glob 10 and 13. Both carry
# a medium-severity advisory (GHSA-g3hv-75wg-m249 for minimatch,
# GHSA-3g3m-2fjr-6pw4 for glob) that is only fixed in a new major: minimatch
# 11.0.1 and glob 14.0.2. No fix was backported. The majors drop APIs these
# consumers do not call (makeRe, the AST class, the debug option) and keep the
# CommonJS builds jest requires, so the override is a transitive major on
# purpose. Dev only. Drop these once test-exclude, eslint, and
# typescript-eslint move to the patched majors.
overrides:
  minimatch: "^11.0.1"
  glob: "^14.0.2"
