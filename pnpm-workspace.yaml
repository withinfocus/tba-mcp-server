# pnpm settings. As of pnpm 11 this file, not package.json or .npmrc, is where
# pnpm-specific configuration lives. See https://pnpm.io/settings.

# Save dependency versions exactly; upgrades are handled by Dependabot.
savePrefix: ""

# Dependencies allowed to run install lifecycle scripts. Everything else is
# blocked by default; run `pnpm approve-builds` to review new requests.
allowBuilds:
  # Unpacks the bundled web, CLI, and TUI clients that `pnpm run inspect` runs.
  "@modelcontextprotocol/inspector": true
  # Selects the prebuilt watcher binding jest-haste-map uses for --watch.
  "@parcel/watcher": true
  # Selects the prebuilt native binding for the current platform.
  unrs-resolver: true

# Transitive pins for advisories with no fix upstream yet. Drop an entry once
# the dependency that pulls it in has moved on by itself.
overrides:
  # ajv 8.20.0 asks for ^3.0.1 and resolves 3.1.5, which is subject to four
  # SSRF and host-confusion advisories: GHSA-5jgf-p345-68v8,
  # GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp. ajv reaches
  # production through @modelcontextprotocol/sdk. Caret, not an exact pin, so
  # later 3.x patches still land without editing this.
  fast-uri: "^3.1.6"
