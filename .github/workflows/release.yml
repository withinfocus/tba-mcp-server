name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      _IMAGE_NAME: ghcr.io/withinfocus/tba-mcp-server

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get package version
        id: retrieve-package-version
        run: |
          version=$( jq -r ".version" package.json )
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get latest build run
        id: latest-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Filter on conclusion client-side; the API's status filter can return stale runs
          latest_run=$(gh run list --workflow=ci.yml --commit="$GITHUB_SHA" --limit=20 --json=databaseId,conclusion --jq='[.[] | select(.conclusion == "success")][0].databaseId')
          if [ -z "$latest_run" ] || [ "$latest_run" = "null" ]; then
            echo "::error::No successful CI run found for commit $GITHUB_SHA"
            exit 1
          fi
          echo "run_id=$latest_run" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-server-${{ steps.retrieve-package-version.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.latest-build.outputs.run_id }}

      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: "./mcp-server-${{ steps.retrieve-package-version.outputs.version }}.zip"
          artifactErrorsFailBuild: true
          commit: ${{ github.sha }}
          tag: v${{ steps.retrieve-package-version.outputs.version }}
          name: v${{ steps.retrieve-package-version.outputs.version }}
          body: "<insert release notes here>"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push Docker image
        run: |
          docker pull "${{ env._IMAGE_NAME }}:dev"
          docker tag "${{ env._IMAGE_NAME }}:dev" "${{ env._IMAGE_NAME }}:${{ steps.retrieve-package-version.outputs.version }}"
          docker push "${{ env._IMAGE_NAME }}:${{ steps.retrieve-package-version.outputs.version }}"

      - name: Log out from GitHub Container Registry
        run: docker logout ghcr.io
