# zizmor configuration. See https://docs.zizmor.sh/configuration/.

rules:
  # Every action is pinned to a commit hash, with its version in a trailing
  # comment that Dependabot updates along with the hash. Require a hash pin
  # for all actions, including the actions/* ones zizmor would otherwise
  # accept on a tag.
  unpinned-uses:
    config:
      policies:
        "*": hash-pin

  # The build job caches pnpm downloads and also pushes the image. Poisoning
  # that cache means writing to it first, which needs push access to this
  # repository, and the job itself only runs on pushes to main. Low confidence.
  cache-poisoning:
    ignore:
      - ci.yml
