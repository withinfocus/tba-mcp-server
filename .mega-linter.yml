# Lint what a PR changes rather than the whole repository.
VALIDATE_ALL_CODEBASE: false

# Superseded by the eslint and prettier configuration in this repository.
DISABLE_LINTERS:
  - JAVASCRIPT_STANDARD
  - TYPESCRIPT_STANDARD

# Generated by pnpm; never hand-formatted.
FILTER_REGEX_EXCLUDE: '(pnpm-lock\.yaml)'

# eslint.config.js imports @eslint/js, globals, typescript-eslint, and
# @stylistic/eslint-plugin. Flat config resolves those as native ESM, which
# ignores NODE_PATH, so MegaLinter's bundled eslint cannot find them and aborts
# before checking anything. Install the workspace dependencies and use the
# project's own eslint, which also keeps CI on the same version as `pnpm lint`.
# The container has npm but not corepack, hence installing pnpm by hand.
TYPESCRIPT_ES_PRE_COMMANDS:
  - command: >-
      npm i -g "$(node -p "require('./package.json').packageManager")"
      && pnpm install --frozen-lockfile --ignore-scripts
    cwd: workspace
    continue_if_failed: false
TYPESCRIPT_ES_CLI_EXECUTABLE:
  - node_modules/.bin/eslint

# The ref-confusion audit calls the GitHub API to list branches for each action
# in a `uses:` clause, and fails the run with a 401 without a token.
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN

# Audit every workflow, not just the one a PR happens to touch, by passing the
# directory alongside the changed-file list MegaLinter builds. Whichever file
# changed gets reported twice, which is noise in the log but does not affect the
# result. Gate on medium and above; lower findings stay visible. Rule
# configuration lives in .github/zizmor.yml, which zizmor discovers itself.
ACTION_ZIZMOR_ARGUMENTS:
  - --min-severity
  - medium
  - .github/workflows
