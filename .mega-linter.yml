# MegaLinter configuration. The Lint job in .github/workflows/pr.yml also sets
# VALIDATE_ALL_CODEBASE, DISABLE_LINTERS, FILTER_REGEX_EXCLUDE, and
# LLM_ADVISOR_ENABLED as env vars, which take precedence over this file.

# eslint.config.js imports @eslint/js, globals, typescript-eslint, and
# @stylistic/eslint-plugin. Flat config resolves those as native ESM, which
# ignores NODE_PATH, so MegaLinter's bundled eslint cannot find them and aborts
# before checking anything. Install the workspace dependencies and use the
# project's own eslint, which also keeps CI on the same version as `pnpm lint`.
# The container has npm but not corepack, hence installing pnpm by hand.
TYPESCRIPT_ES_PRE_COMMANDS:
  - command: >-
      npm i -g "$(node -p "require('./package.json').packageManager")"
      && pnpm install --frozen-lockfile --ignore-scripts
    cwd: workspace
    continue_if_failed: false
TYPESCRIPT_ES_CLI_EXECUTABLE: node_modules/.bin/eslint

# The ref-confusion audit calls the GitHub API to list branches for each action
# in a `uses:` clause, and fails the run with a 401 without a token.
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN

# Audit every workflow on every run, not just the ones a PR happens to touch, so
# a finding surfaces when it is introduced rather than whenever that file is next
# edited. Project mode ignores the changed-file list, hence passing the directory
# explicitly. Gate on medium and above; lower findings stay visible in the log.
# Rule configuration lives in .github/zizmor.yml, which zizmor discovers itself.
ACTION_ZIZMOR_CLI_LINT_MODE: project
ACTION_ZIZMOR_ARGUMENTS:
  - --min-severity
  - medium
  - .github/workflows
